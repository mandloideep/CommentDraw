name: Backend Build & Deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test-build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run unit tests
        run: mvn -f Backend/pom.xml test

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./Backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/commentdraw-backend:latest
            ghcr.io/${{ github.repository_owner }}/commentdraw-backend:${{ github.sha }}

      - name: Trigger Dokploy redeploy
        run: curl -fsS -X POST "${{ secrets.DOKPLOY_BACKEND_WEBHOOK }}"
